name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-11-vs2026-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        shell: cmd
        run: build.bat llvm

      - name: Create Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "${{ github.ref_name }}" `
            --generate-notes `
            .\build\Wakelock-x86.exe `
            .\build\Wakelock-x86.pdb `
            .\build\Wakelock-x64.exe `
            .\build\Wakelock-x64.pdb `
            .\build\Wakelock-arm64.exe `
            .\build\Wakelock-arm64.pdb
